name: Daily Digest

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  digest:
    name: Build & publish digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate digest
        run: |
          SINCE=$(date -u -d "24 hours ago" +%Y-%m-%dT%H:%M:%SZ)
          OUT=digest.md
          {
            echo "## Daily Digest — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| member | commits (24h) | files touched (24h) | total commits |"
            echo "|---|---:|---:|---:|"
            for d in repos/*/; do
              m=$(basename "$d")
              c=$(git log --since="$SINCE" --oneline -- "$d" | wc -l | tr -d ' ')
              f=$(git log --since="$SINCE" --name-only --pretty=format: -- "$d" | grep -c . || true)
              t=$(git log --oneline -- "$d" | wc -l | tr -d ' ')
              echo "| $m | $c | $f | $t |"
            done
            echo ""
            echo "### Last 24h activity"
            echo '```'
            git log --since="$SINCE" --pretty=format:'%ad  %an  %s' --date=short -- repos/ || echo "no commits"
            echo ""
            echo '```'
          } > "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish as issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Daily Digest';
            const body = fs.readFileSync('digest.md', 'utf8');
            const { owner, repo } = context.repo;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'digest' });
            } catch (e) {
              await github.rest.issues.createLabel({ owner, repo, name: 'digest', color: '0e8a16' });
            }

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'digest', per_page: 1,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.data[0].number, body,
              });
              core.info(`updated issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: ['digest'] });
              core.info(`created issue #${created.data.number}`);
            }
