name: CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Member inventory
        run: |
          echo "### Members" >> "$GITHUB_STEP_SUMMARY"
          for d in repos/*/; do
            echo "- \`$(basename "$d")\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Every member has a README
        run: |
          missing=0
          for d in repos/*/; do
            if ! ls "$d" | grep -ixq 'readme.*'; then
              echo "::warning::no README in $d"
            fi
          done

      - name: No oversized files (GitHub limit is 100 MB)
        run: |
          find repos -type f -size +90M -print | tee "$RUNNER_TEMP/big.txt"
          if [ -s "$RUNNER_TEMP/big.txt" ]; then
            echo "::error::files over 90MB found"
            exit 1
          fi

      - name: No leaked secrets (basic scan)
        run: |
          hits=$(grep -rInE 'ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}' \
                  repos 2>/dev/null \
                | grep -viE 'EXAMPLE|PLACEHOLDER|SAMPLE|YOUR_|<your|\\\${|process\.env|abcdefghij' \
                || true)
          if [ -n "$hits" ]; then
            echo "$hits" | head -30
            echo "::error::possible secret material found"
            exit 1
          fi
          echo "no secrets detected"

      - name: Python syntax check (report)
        run: |
          python3 - <<'PYEOF'
          import pathlib
          bad = []
          n = 0
          for p in pathlib.Path("repos").rglob("*.py"):
              if any(part in ("node_modules", ".venv", "venv") for part in p.parts):
                  continue
              n += 1
              try:
                  compile(p.read_bytes(), str(p), "exec")
              except SyntaxError as e:
                  bad.append(f"{p}:{e.lineno} {e.msg}")
              except ValueError:
                  pass  # encoding declaration quirks
          print(f"checked {n} python files")
          for b in bad:
              print(f"::warning::pre-existing syntax issue: {b}")
          PYEOF

      - name: JSON / JSONC parse check
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, sys

          def strip_jsonc(s):
              out, i, n, in_str, esc = [], 0, len(s), False, False
              while i < n:
                  c = s[i]
                  if in_str:
                      out.append(c)
                      if esc:
                          esc = False
                      elif c == "\\":
                          esc = True
                      elif c == '"':
                          in_str = False
                      i += 1
                  elif c == '"':
                      in_str = True
                      out.append(c)
                      i += 1
                  elif c == "/" and i + 1 < n and s[i + 1] == "/":
                      while i < n and s[i] != "\n":
                          i += 1
                  elif c == "/" and i + 1 < n and s[i + 1] == "*":
                      i += 2
                      while i + 1 < n and not (s[i] == "*" and s[i + 1] == "/"):
                          i += 1
                      i += 2
                  else:
                      out.append(c)
                      i += 1
              return "".join(out)

          bad, n = [], 0
          for p in pathlib.Path("repos").rglob("*.json"):
              if not p.is_file():
                  continue
              n += 1
              text = p.read_text(encoding="utf-8", errors="replace")
              try:
                  json.loads(text)
                  continue
              except Exception:
                  pass
              try:
                  json.loads(strip_jsonc(text))
                  print(f"::notice::JSONC accepted: {p}")
              except Exception as e:
                  bad.append(f"{p}: {e}")
          print(f"checked {n} json files")
          for b in bad[:50]:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          PYEOF
